name: ci
on:
  pull_request:
  push: { branches: [main] }
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          {
            POSTGRES_USER: expense,
            POSTGRES_PASSWORD: expense,
            POSTGRES_DB: expense,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U expense" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://expense:expense@localhost:5432/expense
      TESTCONTAINERS_DISABLED: "1" # helpers.ts honors this (Step 2 below)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  deploy:
    needs: [checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy hook wired in Task 25"
